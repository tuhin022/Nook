<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nook: chats first, posts second</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F8; --surface:#FFFFFF; --surface2:#F3F4FB; --ink:#171A2E; --muted:#5F6488; --line:#DFE2F1;
  --accent:#4A4AE6; --accent-ink:#FFFFFF; --danger:#CB2C55; --ok:#178A66; --sig:#5B5BF0;
  --lift:0 14px 34px -12px rgba(23,26,46,.34);
  --display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0D1022;--surface:#171B37;--surface2:#20254A;--ink:#EEF0FF;--muted:#A3A9D3;--line:#2B3062;--accent:#8F8FFF;--accent-ink:#0D1022;--danger:#FF6E93;--ok:#3DD6A0;--lift:0 14px 34px -12px rgba(0,0,0,.7)}
}
:root[data-theme="dark"]{--bg:#0D1022;--surface:#171B37;--surface2:#20254A;--ink:#EEF0FF;--muted:#A3A9D3;--line:#2B3062;--accent:#8F8FFF;--accent-ink:#0D1022;--danger:#FF6E93;--ok:#3DD6A0;--lift:0 14px 34px -12px rgba(0,0,0,.7)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--body);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.025em}
p{margin:0}
img,video{max-width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.ic{flex:none;display:block}.ic.fill{fill:currentColor}
#app{height:100%}
.shell{height:100%;display:flex;flex-direction:column}
.main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}

/* ---------- navigation ---------- */
.rail{order:2;display:flex;flex:none;background:var(--surface);border:1px solid var(--line);margin:0 12px 10px;border-radius:30px;padding:5px 6px;box-shadow:var(--lift)}
.rail .logo{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0 3px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
.tab .ti{position:relative;display:grid;place-items:center;width:60px;height:30px;border-radius:15px;transition:background .15s}
.tab.on{color:var(--accent)}
.tab.on .ti{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tab .dot{position:absolute;top:-5px;right:4px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px;border:2px solid var(--surface);box-sizing:content-box}
.tab.gear{display:none}
@media(max-width:899px){.shell.in-chat .rail{display:none}}
@media(min-width:900px){
  .shell{flex-direction:row}
  .rail{order:0;flex-direction:column;width:96px;margin:0;border:0;border-right:1px solid var(--line);border-radius:0;box-shadow:none;padding:18px 0;gap:8px}
  .rail .logo{display:block;margin:0 auto 14px}
  .tab{flex:none;padding:4px 0}
  .tab .ti{width:56px;height:36px;border-radius:18px}
  .tab.gear{display:flex;margin-top:auto}
}

/* ---------- shared ---------- */
.top{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;flex:none}
.top h1{flex:1;font-size:32px;font-weight:800;line-height:1.05}
.acts{display:flex;gap:2px}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none}
.ib:hover{background:var(--surface2)}
.ib .bd{position:absolute;top:4px;right:3px;min-width:17px;height:17px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.page{flex:1;min-height:0;overflow-y:auto}
.col{max-width:640px;margin:0 auto;padding:0 16px 32px}
.btn{padding:11px 18px;border-radius:15px;font-weight:700;background:var(--accent);color:var(--accent-ink);text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn.ghost{background:var(--surface2);color:var(--ink)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn.sm{padding:7px 14px;font-size:14px;border-radius:12px}
.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{color:var(--accent);font-weight:600;font-size:14px}
.muted{color:var(--muted)}
.center{text-align:center}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sfield{position:relative;margin:4px 16px 10px;flex:none}
.sfield .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sfield input{padding-left:42px}
.field{width:100%;border:1.5px solid var(--line);background:var(--surface2);border-radius:15px;padding:12px 14px;outline:none}
.field:focus{border-color:var(--accent)}
textarea.field{resize:none;display:block}
label.lbl{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.av{position:relative;flex:none;display:inline-block;vertical-align:middle}
.av .avi{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;background:var(--surface2)}
.av .avi svg,.av .avi img{display:block;width:100%;height:100%;object-fit:cover}
.av .pres{position:absolute;right:0;bottom:0;width:26%;height:26%;min-width:10px;min-height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.av .stb{position:absolute;right:-4px;bottom:-2px;min-width:34px;height:34px;border-radius:17px;background:var(--surface);display:grid;place-items:center;font-size:19px;font-style:normal;border:2px solid var(--pring,var(--surface));box-shadow:0 2px 8px rgba(0,0,0,.16)}
.av.grp .avi{display:grid;place-items:center;font-family:var(--display);font-weight:800}
.ring{padding:3px;border-radius:50%;background:var(--sig);flex:none;display:inline-block;line-height:0}
.ring.seen{background:var(--line)}
.ring .av{border:3px solid var(--bg);border-radius:50%;box-sizing:content-box}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;background:var(--surface);display:inline-flex;gap:6px;align-items:center}
.chip.on{background:color-mix(in srgb,var(--accent) 16%,var(--surface));border-color:var(--accent);color:var(--accent)}

/* ---------- chats list ---------- */
.chats{flex:1;min-height:0;display:grid;grid-template-columns:1fr}
.list{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.lscroll{flex:1;overflow-y:auto;padding-bottom:8px}
.convo{display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg);background:color-mix(in srgb,var(--sig) 10%,var(--bg))}
@media(max-width:899px){.chats.has-open .list{display:none}.chats:not(.has-open) .convo{display:none}}
@media(min-width:900px){.chats{grid-template-columns:380px 1fr}.list{border-right:1px solid var(--line)}}
.now{display:flex;gap:14px;overflow-x:auto;padding:4px 16px 14px}
.now button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-width:58px}
.crow{display:flex;align-items:center;gap:13px;width:calc(100% - 16px);margin:0 8px;padding:10px 10px;border-radius:20px}
.crow:hover,.crow.on{background:var(--surface)}
.cm{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.cn{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16.5px}
.cn.b,.cp.b{font-weight:700;color:var(--ink)}
.cp{font-size:14.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--bc,var(--accent));color:var(--bi,var(--accent-ink));font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.tag{font-size:11px;font-weight:700;background:var(--surface2);color:var(--muted);border-radius:6px;padding:2px 6px;margin-left:6px}
.reqrow .ico{width:54px;height:54px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent)}

/* ---------- conversation ---------- */
.chead{display:flex;align-items:center;gap:6px;padding:9px 8px 9px 4px;background:var(--surface);border-bottom:1px solid var(--line);flex:none}
.chead .who{flex:1;min-width:0;display:flex;align-items:center;gap:11px;text-align:left}
.chead .nm{font-weight:700;line-height:1.2;font-size:16.5px}
.chead .st{font-size:13px;color:var(--muted)}
.chead .st.typing{color:var(--accent);font-weight:600}
.chead .back{display:grid}
@media(min-width:900px){.chead .back{display:none}.chead{padding-left:16px}}
.msgs{flex:1;min-height:0;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;background-image:var(--wp,none);background-size:180px 180px}
.msgs>:first-child{margin-top:auto}
.banner{align-self:center;max-width:90%;text-align:center;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin:6px 0 10px;display:flex;gap:6px;align-items:center}
.mrow{display:flex;flex-direction:column;align-items:flex-start;margin-top:3px;max-width:100%}
.mrow.first{margin-top:12px}
.mrow.mine{align-items:flex-end}
.sn{font-size:12px;font-weight:700;margin:0 0 3px 12px}
.bub{max-width:min(80%,460px);padding:9px 13px 6px;border-radius:22px 22px 22px 6px;background:var(--surface);border:1px solid var(--line);overflow-wrap:anywhere;cursor:pointer;text-align:left;line-height:1.38}
.mine .bub{border-radius:22px 22px 6px 22px;border-color:transparent}
.bub.sel{outline:2px solid var(--accent);outline-offset:2px}
.bub .meta{display:flex;gap:4px;align-items:center;justify-content:flex-end;font-size:11px;opacity:.72;margin-top:2px}
.tick{display:inline-flex;align-items:center;gap:3px}.mine .tick.rd{font-weight:700}
.quote{border-left:3px solid currentColor;opacity:.78;padding:1px 8px;margin:0 0 6px;font-size:13px;border-radius:2px}
.rx{display:flex;gap:4px;margin:2px 8px 0;flex-wrap:wrap}
.rx span{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 7px;font-size:13px;line-height:22px}
.trans{font-size:13px;margin:3px 8px 0;color:var(--muted);max-width:78%}
.acts2{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px;margin-top:6px;flex-wrap:wrap;box-shadow:var(--lift)}
.acts2 button{padding:6px 9px;border-radius:12px;display:flex;gap:5px;align-items:center;font-size:14px;font-weight:600}
.acts2 button:hover{background:var(--surface2)}
.acts2 i{width:1px;height:20px;background:var(--line);margin:0 3px}
.acts2 .danger{color:var(--danger)}
.hid{font-size:14px;font-style:italic;opacity:.85}
.typing-b{display:flex;gap:4px;padding:13px 15px}
.typing-b i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.1s infinite}
.typing-b i:nth-child(2){animation-delay:.15s}.typing-b i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,80%,100%{opacity:.25}40%{opacity:1}}
.summary{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;margin:0 0 12px;font-size:14px}
.summary b{display:flex;gap:6px;align-items:center;margin-bottom:4px;color:var(--accent)}
.bub.media{padding:4px 4px 6px}
.bub.media .meta{padding:0 8px}
.mimg{display:block;border-radius:18px;width:min(260px,64vw);aspect-ratio:4/5;object-fit:cover;background:var(--surface2)}
.mvid{position:relative;display:block;border-radius:18px;overflow:hidden;line-height:0}
.mvid video{display:block;width:min(260px,64vw);aspect-ratio:4/5;object-fit:cover;background:#000}
.playbtn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(10,12,32,.55);color:#fff;display:grid;place-items:center;backdrop-filter:blur(6px)}
.vmsg{display:flex;align-items:center;gap:10px;min-width:210px;padding:2px 2px 0}
.vmsg .pp{width:40px;height:40px;border-radius:50%;background:currentColor;display:grid;place-items:center;flex:none}
.vmsg .pp svg{color:var(--pp-ink,#fff)}
.vmsg .i-pause{display:none}.vmsg.playing .i-pause{display:block}.vmsg.playing .i-play{display:none}
.vmsg .wv{display:flex;align-items:center;gap:2px;height:32px;flex:1}
.vmsg .wv i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:currentColor;opacity:.35}
.vmsg .wv i.on{opacity:1}
.vmsg .vt{font-size:12px;font-variant-numeric:tabular-nums;opacity:.8;min-width:30px;text-align:right}
.vlink{font-size:12px;font-weight:600;opacity:.8;text-decoration:underline;margin:2px 0 0 2px}
.vdemo{font-size:10px;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:0 4px;opacity:.7;margin-left:6px}
.callrow{align-self:center;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;margin:10px 0}
.callrow.missed{color:var(--danger)}
.composer{flex:none;padding:8px 10px 10px;background:var(--surface);border-top:1px solid var(--line)}
.replying{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);padding:4px 8px 8px}
.replying span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 4px 8px}
.chips button{border:1.5px solid var(--line);border-radius:16px;padding:5px 12px;font-size:14px;font-weight:600;background:var(--surface2);display:inline-flex;gap:5px;align-items:center}
.chips button:hover{border-color:var(--accent)}
.chips .ai{color:var(--accent)}
.chips .think{border:0;background:none;color:var(--muted);font-weight:500;padding:5px 4px}
.cin{display:flex;align-items:flex-end;gap:6px}
.cin textarea{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:24px;background:var(--surface2);padding:11px 16px;outline:none;max-height:120px;resize:none;line-height:1.35}
.cin textarea:focus{border-color:var(--accent)}
.cin .ib{width:44px;height:44px;color:var(--muted)}
.send{width:46px;height:46px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.rec{display:flex;align-items:center;gap:10px;background:var(--surface2);border-radius:26px;padding:4px 4px 4px 6px;min-height:50px}
.rec .rd{width:11px;height:11px;border-radius:50%;background:var(--danger);animation:bl 1.2s infinite;flex:none}
.rec .rt{font-variant-numeric:tabular-nums;font-weight:700;min-width:42px}
.rec .live{flex:1;display:flex;align-items:center;gap:2px;height:32px;overflow:hidden}
.rec .live i{flex:1;min-width:2px;max-width:4px;border-radius:2px;background:var(--accent);height:4px}
.notice{background:var(--surface2);border-radius:18px;padding:12px 14px;font-size:14px}
.notice .row2{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.empty{flex:1;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
.empty h2{color:var(--ink);font-size:28px;margin:16px 0 6px}
@media(max-width:899px){.empty{display:none}}

/* ---------- feed ---------- */
.moments{display:flex;gap:14px;overflow-x:auto;padding:6px 2px 16px}
.moments button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;min-width:66px}
.addm{position:relative;width:66px;height:66px;border-radius:50%;display:grid;place-items:center}
.addm .plus{position:absolute;right:-2px;bottom:-2px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:3px solid var(--bg);box-sizing:content-box}
.post{background:var(--surface);border:1px solid var(--line);border-radius:28px;margin:0 0 18px;overflow:hidden}
.ph{display:flex;align-items:center;gap:11px;padding:12px 14px}
.ph .pn{flex:1;min-width:0;line-height:1.2}
.ph .pn b{display:block;font-size:16px}
.ph .pn span{font-size:13px;color:var(--muted);display:flex;gap:5px;align-items:center}
.poster{position:relative;aspect-ratio:1/1;display:flex;align-items:flex-end;padding:26px;font-family:var(--display);font-weight:800;line-height:1.1;letter-spacing:-.025em;overflow:hidden}
.poster .pdeco{position:absolute;inset:0;width:100%;height:100%}
.poster p{position:relative;overflow-wrap:anywhere}
.media{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--surface2);width:100%;display:block}
.media.sq{aspect-ratio:1/1}
.media img,.media video{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.media svg{display:block}
.media.blur svg,.media.blur img{filter:blur(28px)}
.vbadge{position:absolute;left:12px;top:12px;background:rgba(10,12,32,.6);color:#fff;border-radius:999px;padding:3px 10px 3px 8px;font-size:12px;font-weight:700;display:flex;gap:5px;align-items:center;backdrop-filter:blur(6px)}
.sens{position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:rgba(15,17,40,.35);color:#fff;text-align:center;padding:20px;font-weight:600}
.cap{padding:12px 16px 0;overflow-wrap:anywhere}
.pa{display:flex;align-items:center;gap:2px;padding:8px 8px 8px}
.pa button{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:14px;font-weight:600;font-size:14px}
.pa button:hover{background:var(--surface2)}
.pa .sp{flex:1}
.pa .liked{color:var(--danger)}
.pa .liked svg.pop{animation:heart .34s cubic-bezier(.2,1.6,.4,1)}
@keyframes heart{0%{transform:scale(.6)}100%{transform:scale(1)}}

/* ---------- discover ---------- */
.prow{display:flex;align-items:center;gap:13px;padding:10px 0;cursor:pointer}
.prow .pm{flex:1;min-width:0}
.prow .pm b,.prow .pm span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .pm span{font-size:14px;color:var(--muted)}
.cbx{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:#fff}
.cbx.on{background:var(--accent);border-color:var(--accent)}
.topics{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 16px}
h3.sec{font-size:19px;margin:20px 0 4px}

/* ---------- profile ---------- */
.hero{position:relative;height:176px;overflow:hidden}
.hero svg,.hero img{display:block;width:100%;height:100%;object-fit:cover}
.pcard{position:relative;margin-top:-30px;background:var(--pbg,var(--surface));color:var(--pink,var(--ink));border-radius:32px 32px 0 0;padding:0 20px 8px;--pring:var(--pbg,var(--surface))}
@media(min-width:640px){.hero{border-radius:0 0 28px 28px}.pcard{border-radius:32px}}
.pcard .av{margin-top:-46px;border:5px solid var(--pring);border-radius:50%;box-sizing:content-box;background:var(--pring)}
.pcard h2{font-size:30px;font-weight:800;margin-top:10px;display:flex;align-items:center;gap:8px;line-height:1.05}
.pcard .handle{opacity:.72;margin-top:3px}
.pcard .st{display:inline-flex;gap:7px;align-items:center;border-radius:999px;padding:5px 13px 5px 10px;margin-top:12px;font-weight:600;font-size:14px;background:color-mix(in srgb,currentColor 12%,transparent)}
.pcard .bio{margin-top:10px;overflow-wrap:anywhere}
.pcard .lnk{display:inline-flex;gap:6px;align-items:center;margin-top:8px;font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.ints{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ints span{border-radius:999px;padding:3px 12px;font-size:13px;font-weight:600;background:color-mix(in srgb,currentColor 12%,transparent)}
.stats{display:flex;margin:16px 0 14px;border-radius:20px;background:color-mix(in srgb,currentColor 8%,transparent);padding:12px 4px}

(()=>{

const BANNERS=['shapes','tiles','waves','dots','stripes','rings'];
function bannerSVG(u,style){

/* ---------- sending messages ---------- */
const REPLIES={q:['Good question. Let me think 😅','Honestly? Not sure yet.','Ask me tomorrow, my brain is fried'],y:['haha yes','omg same','that is exactly it','okay that made my day','love that'],n:['wait, really?','tell me more','ha, did not expect that','send a photo!']};
function replyFor(m){
 if(m.type==='voice')return pick(['Loved hearing your voice 😄','Ha, voice notes are the best','Listening on repeat 🎧']);
 if(m.type==='image')return pick(['Oh that is gorgeous','Wait, where is this?','Framing this 😍']);
 if(m.type==='video')return pick(['Ha! Send more','Watched it twice','This made my day']);
 return pick(String(m.text).includes('?')?REPLIES.q:(Math.random()>.5?REPLIES.y:REPLIES.n));
}
function simulateReply(c,m){
 if(peer(c)&&S.blocked.has(peer(c)))return;
 const who=c.type==='dm'?c.with:pick(c.members);
 setTimeout(()=>{S.typing=c.id;S.stick=S.openChat===c.id;render()},1100);
 setTimeout(()=>{S.typing=null;c.msgs.push({id:uid(),from:who,text:replyFor(m),ts:Date.now(),react:[]});if(S.set.readReceipts)m.st='read';const open=S.openChat===c.id&&S.tab==='chats';if(!open)c.unread++;S.stick=open;render()},2900+Math.random()*1200);
}
function addMsg(c,partial){
 const m=Object.assign({id:uid(),from:'me',ts:Date.now(),st:'sent',react:[]},partial);
 c.msgs.push(m);c.unread=0;S.sugg[c.id]=null;S.stick=S.openChat===c.id;S.sel=null;render();
 setTimeout(()=>{m.st='delivered';render()},600);
 simulateReply(c,m);
 return m;
}
function sendMsg(){const c=curChat(),t=(S.drafts['msg-in']||'').trim();if(!c||!t)return;const p={text:t};if(S.replyTo)p.reply=S.replyTo;S.drafts['msg-in']='';S.replyTo=null;addMsg(c,p)}
function sendAttachment(f){

/* ---------- voice messages: record ---------- */
let RCD=null;
function levelOf(an,buf){an.getByteTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;s+=v*v}return Math.min(1,Math.sqrt(s/buf.length)*4)}
async function startRec(){
 const c=curChat();if(!c||S.rec)return;
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia&&window.MediaRecorder)){S.rec={err:'unsupported'};render();return}
 S.rec={starting:true};render();
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  if(!S.rec||!S.rec.starting){stream.getTracks().forEach(t=>t.stop());return}
  const mr=new MediaRecorder(stream),chunks=[];
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  RCD={mr,stream,chunks,t0:Date.now(),levels:[],chatId:c.id,timer:null};
  try{const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC(),src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();an.fftSize=256;src.connect(an);RCD.ctx=ctx;RCD.an=an;RCD.buf=new Uint8Array(an.fftSize)}catch(e){}
  mr.start(250);S.rec={on:true};render();
  RCD.timer=setInterval(tickRec,100);
 }catch(e){S.rec={err:(e&&(e.name==='NotAllowedError'||e.name==='SecurityError'))?'denied':'unsupported'};render()}
}
function tickRec(){
 if(!RCD)return;const el=(Date.now()-RCD.t0)/1000,t=$('#rec-t');if(t)t.textContent=fmt(el);
 RCD.levels.push(RCD.an?levelOf(RCD.an,RCD.buf):.2+Math.random()*.3);
 const live=$('#rec-live');if(live){const bars=live.children,n=bars.length,recent=RCD.levels.slice(-n),off=n-recent.length;for(let i=0;i<n;i++){const v=i<off?0:recent[i-off];bars[i].style.height=(4+v*26)+'px'}}
 if(el>=120)finishRec(true);
}
function downsample(a,n){
 if(!a.length)return waveFrom(7,n);
 const o=[];for(let i=0;i<n;i++){const s=Math.floor(i*a.length/n),e=Math.max(s+1,Math.floor((i+1)*a.length/n));let m=0;for(let j=s;j<e&&j<a.length;j++)m=Math.max(m,a[j]);o.push(m)}
 const mx=Math.max.apply(null,o.concat([.05]));return o.map(v=>+Math.max(.15,Math.min(1,v/mx)).toFixed(2));
}
function finishRec(send){
 const r=RCD;if(!r){if(S.rec){S.rec=null;render()}return}
 RCD=null;clearInterval(r.timer);
 const dur=Math.round((Date.now()-r.t0)/1000);
 const cleanup=()=>{r.stream.getTracks().forEach(t=>t.stop());if(r.ctx){try{r.ctx.close()}catch(e){}}};
 const done=()=>{
  cleanup();if(!send)return;
  if(dur<1){toast('Too short. Record a little longer.');return}
  const blob=new Blob(r.chunks,{type:r.mr.mimeType||'audio/webm'});
  if(!blob.size){toast('Nothing was recorded');return}
  const c=S.chats.find(x=>x.id===r.chatId);if(!c)return;
  addMsg(c,{type:'voice',dur:Math.max(1,dur),src:URL.createObjectURL(blob),wave:downsample(r.levels,32)});
 };
 S.rec=null;
 if(r.mr.state!=='inactive'){r.mr.onstop=done;try{r.mr.stop()}catch(e){done()}}else done();
 render();
}
function demoVoice(){
 const c=curChat();S.rec=null;if(!c){render();return}
 const text=pick(['Hey! Quick voice note from me. Call you later.','Just landed. Talk in a bit!','Ha, you would not believe my morning.']);
 addMsg(c,{type:'voice',demo:true,text,dur:Math.max(3,Math.round(words(text)*.42)),wave:waveFrom(hash(text))});
}

/* ---------- voice messages: play ---------- */
const PL={audio:null,timer:null};
function stopPlay(){
 if(PL.audio){try{PL.audio.pause()}catch(e){}PL.audio=null}
 clearInterval(PL.timer);PL.timer=null;
 try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
 S.play=null;syncPlay();
}
function playVoice(id){
 const c=curChat(),m=c&&c.msgs.find(x=>x.id===id);if(!m)return;
 if(S.play&&S.play.id===id){stopPlay();return}
 stopPlay();S.play={id,p:0};
 if(m.src){
  const a=new Audio(m.src);PL.audio=a;
  a.ontimeupdate=()=>{if(S.play&&S.play.id===id){S.play.p=(a.duration&&isFinite(a.duration))?a.currentTime/a.duration:Math.min(1,a.currentTime/m.dur);syncPlay()}};
  a.onended=()=>{if(S.play&&S.play.id===id)stopPlay()};
  a.onerror=()=>{toast("Couldn't play that voice message");stopPlay()};
  const pr=a.play();if(pr&&pr.catch)pr.catch(()=>{toast("Couldn't play that voice message");stopPlay()});
 }else{
  const t0=Date.now(),total=m.dur*1000;
  PL.timer=setInterval(()=>{if(!S.play||S.play.id!==id){clearInterval(PL.timer);return}S.play.p=Math.min(1,(Date.now()-t0)/total);syncPlay();if(S.play.p>=1)stopPlay()},100);
  try{if('speechSynthesis' in window&&m.text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(m.text);u.rate=1.05;u.onend=()=>{if(S.play&&S.play.id===id)stopPlay()};speechSynthesis.speak(u)}}catch(e){}
 }
 syncPlay();
}
function syncPlay(){
 $$('.vmsg').forEach(el=>{
  const on=!!(S.play&&S.play.id===el.dataset.id),p=on?S.play.p:0,bars=el.querySelectorAll('.wv i'),n=bars.length,dur=+el.dataset.dur;
  bars.forEach((b,i)=>b.classList.toggle('on',on&&i<p*n));
  el.classList.toggle('playing',on);
  const t=el.querySelector('.vt');if(t)t.textContent=fmt(on?Math.round(p*dur):dur);
 });
}

/* ---------- voice calls (demo: the other side is simulated) ---------- */
const CL={timers:[],stream:null,ctx:null,an:null,buf:null};
function clClear(){
 CL.timers.forEach(t=>{clearTimeout(t);clearInterval(t)});CL.timers=[];
 if(CL.stream){CL.stream.getTracks().forEach(t=>t.stop());CL.stream=null}
 if(CL.ctx){try{CL.ctx.close()}catch(e){}CL.ctx=null}
 CL.an=null;try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch(e){}
}
async function callMic(){
 const k=S.call;if(!k)return;
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){k.mic='off';if(k.video)k.cam='off';renderOv();return}
 try{
  const stream=await navigator.mediaDevices.getUserMedia(k.video?{audio:true,video:{facingMode:'user'}}:{audio:true});
  if(S.call!==k){stream.getTracks().forEach(t=>t.stop());return}
  CL.stream=stream;k.mic='on';if(k.video)k.cam=stream.getVideoTracks().length?'on':'off';
  try{const AC=window.AudioContext||window.webkitAudioContext;CL.ctx=new AC();const src=CL.ctx.createMediaStreamSource(stream);CL.an=CL.ctx.createAnalyser();CL.an.fftSize=256;src.connect(CL.an);CL.buf=new Uint8Array(CL.an.fftSize)}catch(e){}
  stream.getAudioTracks().forEach(t=>{t.enabled=!k.muted});
  if(k.video)stream.getVideoTracks().forEach(t=>{t.enabled=!k.camOff});
  renderOv();
 }catch(e){if(S.call===k){k.mic='off';if(k.video)k.cam='off';renderOv()}}
}
function startCall(chatId,video){
 if(S.call)return;
 const c=S.chats.find(x=>x.id===chatId);if(!c)return;
 const g=c.type==='group';if(S.rec)finishRec(false);stopPlay();
 if(video&&S.set.whoCall==='nobody'){toast("You've turned calls off. Turn on calling in Privacy and safety first.");return}
 const peers=g?c.members.slice(0,3):[c.with],u=g?null:U(c.with);
 S.call={chatId,dir:'out',phase:'calling',muted:false,speaker:true,peers,t0:0,mic:'pending',video:!!video,cam:'pending',camOff:false};
 renderOv();callMic();
 const answers=g||u.online;
 CL.timers.push(setTimeout(()=>{
  if(!S.call||S.call.phase!=='calling')return;
  if(answers)connectCall();
  else{S.call.phase='noanswer';renderOv();CL.timers.push(setTimeout(()=>endCall('noanswer'),1600))}
 },answers?2600:6500));
}
function connectCall(){
 const k=S.call;if(!k)return;k.phase='live';k.t0=Date.now();renderOv();
 CL.timers.push(setInterval(()=>{
  if(!S.call)return;const t=$('#call-t');if(t)t.textContent=fmt((Date.now()-S.call.t0)/1000);
  const m=$('#mic-lvl');if(m&&CL.an)m.style.width=Math.round((S.call.muted?0:levelOf(CL.an,CL.buf))*100)+'%';
 },100));
 CL.timers.push(setInterval(()=>{
  $$('.call .cav').forEach(e=>e.classList.remove('talk'));
  if(!S.call||S.call.phase!=='live')return;
  const el=document.querySelector('.call .cav[data-peer="'+pick(S.call.peers)+'"]');if(el&&Math.random()>.25)el.classList.add('talk');
 },1500));
 const c=S.chats.find(x=>x.id===k.chatId);
 CL.timers.push(setTimeout(()=>{
  if(S.call&&S.call.speaker&&'speechSynthesis' in window){try{const g=c&&c.type==='group';speechSynthesis.speak(new SpeechSynthesisUtterance((g?'Hi everyone.':"Hi, it's "+first(U(k.peers[0]))+'.')+' This is a demo call.'))}catch(e){}}
 },900));
}
function endCall(reason){
 const k=S.call;if(!k)return;
 const c=S.chats.find(x=>x.id===k.chatId),dur=k.phase==='live'?Math.round((Date.now()-k.t0)/1000):0;
 clClear();S.call=null;renderOv();
 if(!c)return;
 const m={id:uid(),from:k.dir==='in'?(c.type==='dm'?c.with:c.members[0]):'me',type:'call',dir:k.dir,video:!!k.video,ts:Date.now(),react:[]};
 if(k.phase==='live'&&reason==='ended'){m.dur=dur;m.missed=false}else{m.missed=true;if(reason==='declined')m.declined=true}
 c.msgs.push(m);S.stick=S.openChat===c.id;render();
}
function incomingCall(){
 const c=curChat();if(!c||c.type!=='dm'||S.call)return;const u=U(c.with);S.sheet=null;
 if(S.set.whoCall==='nobody'){render();toast("You've turned calls off, so this call would be blocked before it rings.");return}
 if(S.set.whoCall==='following'&&!S.following.has(u.id)){render();toast("Calls from people you don't follow are blocked, so "+first(u)+"'s call would not ring.");return}
 S.call={chatId:c.id,dir:'in',phase:'ringing',muted:false,speaker:true,peers:[c.with],t0:0,mic:'pending'};
 render();renderOv();
 CL.timers.push(setTimeout(()=>{if(S.call&&S.call.phase==='ringing')endCall('missed')},20000));
}

/* ---------- posting: photos and videos ---------- */
function openSheet(type,id,extra){S.sheet=Object.assign({type,id},extra||{});S.noRestore={sheet:1};S.sel=null;render()}
function openCreate(mode,kind){S.cr={mode:mode||'post',kind:kind||'poster',aud:S.set.postAudience,media:null,caps:null};S.drafts['post-text']='';S.sheet={type:'create'};S.noRestore={sheet:1};render()}
function pickMedia(file){
 const kind=S.cr.kind,mono=S.cr.mode==='moment';
 if(kind==='photo'){
  if(!file.type.startsWith('image/'))return toast('Choose an image file');
  if(file.size>20*1024*1024)return toast('Choose a photo under 20 MB');
  S.cr.media={src:URL.createObjectURL(file),kind,file};render();
 }else{
  if(!file.type.startsWith('video/'))return toast('Choose a video file');
  if(file.size>80*1024*1024)return toast('Choose a video under 80 MB');
  const src=URL.createObjectURL(file),v=document.createElement('video');v.preload='metadata';
  v.onloadedmetadata=()=>{const d=v.duration,lim=mono?60:180;if(isFinite(d)&&d>lim){URL.revokeObjectURL(src);toast('That video is too long. '+(mono?'Moments can be up to 1 minute.':'Posts can be up to 3 minutes.'));return}S.cr.media={src,kind,file,dur:isFinite(d)?Math.round(d):0};render()};
  v.onerror=()=>{URL.revokeObjectURL(src);toast("Couldn't read that video")};
  v.src=src;
 }
}
function publish(){
 const cr=S.cr,t=(S.drafts['post-text']||'').trim();
 if(cr.mode==='moment'){
  const it={ts:Date.now()};
  if(cr.kind==='poster'){if(!t)return;it.k='text';it.text=t}
  else{if(!cr.media)return;it.k=cr.kind;it.src=cr.media.src;it.text=t;if(cr.media.dur)it.dur=cr.media.dur}
  S.myMoms.push(it);S.sheet=null;S.tab='feed';S.noRestore={feed:1};render();toast('Moment shared');return;
 }
 const p={id:uid(),by:'me',kind:cr.kind,text:t,aud:cr.aud,likes:0,liked:false,saved:false,ts:Date.now(),comments:[]};
 if(cr.kind==='poster'){if(!t)return}else{if(!cr.media)return;p.src=cr.media.src;if(cr.media.dur)p.dur=cr.media.dur}
 S.posts.unshift(p);S.sheet=null;S.tab='feed';S.noRestore={feed:1};render();toast('Posted');
 if(p.aud!=='me')simulateEngagement(p);
}
function patchPost(id,pop){const p=S.posts.find(x=>x.id===id);if(!p)return;$$('[data-post="'+id+'"]').forEach(el=>{const t=document.createElement('div');t.innerHTML=postCard(p,pop);el.replaceWith(t.firstElementChild)})}
function pushActivity(type,by,postId){S.activity.unshift({id:uid(),type,by,postId,ts:Date.now(),read:false})}
function simulateEngagement(p){
 const pool=Array.from(S.following);if(!pool.length)return;
 const liker=pick(pool);
 setTimeout(()=>{const post=S.posts.find(x=>x.id===p.id);if(!post)return;post.likes++;pushActivity('like',liker,p.id);render();toast(first(U(liker))+' liked your post')},3200+Math.random()*1500);
 if(Math.random()>.35){
  const rest=pool.filter(id=>id!==liker),commenter=rest.length?pick(rest):liker;
  setTimeout(()=>{const post=S.posts.find(x=>x.id===p.id);if(!post)return;const line=pick(['Love this!','So good 👏','This is great.','Need this energy today.','Okay this is amazing.']);post.comments.push({by:commenter,text:line,ts:Date.now()});pushActivity('comment',commenter,p.id);render();toast(first(U(commenter))+' commented on your post')},5400+Math.random()*2200);
 }
}

 if(!file.type.startsWith('image/'))return toast('Choose an image file');
 const fr=new FileReader();
 fr.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;x.drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);cb(c.toDataURL('image/jpeg',.85))};im.onerror=()=>toast("Couldn't read that image");im.src=fr.result};

}

async function bootBackend(){
 if(!NOOK_DB)return;
 try{
   const {data:{session}}=await NOOK_DB.auth.getSession();
   if(session?.user){
     S.me.id=session.user.id;
     const {data:p}=await NOOK_DB.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
     if(p){S.me=Object.assign({},S.me,{id:p.id,handle:p.handle,name:p.name,bio:p.bio,color:p.color,photo:p.avatar_url,bannerPhoto:p.banner_url,bannerStyle:p.banner_style,link:p.link,interests:p.interests||[],status:{e:p.status_emoji||'',t:p.status_text||''},ready:true});}
     await backendSyncProfile(); render();
   }
   NOOK_DB.auth.onAuthStateChange((_event,session)=>{ if(session?.user){S.me.id=session.user.id;S.me.ready=true;backendSyncProfile();render();} });
 }catch(e){console.warn('Nook backend bootstrap failed',e)}
}

const BACKEND={bucket:'nook-media'};
const authUser=()=>S.session?.user||null;
const dbErr=e=>{console.warn('Nook backend:',e);return e?.message||'Something went wrong. Please try again.'};
async function uploadMedia(file,folder){
 if(!NOOK_DB||!authUser())throw new Error('Not signed in');
 const ext=(file.name&&file.name.split('.').pop()||file.type.split('/').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,8)||'bin';
 const path=`${folder}/${authUser().id}/${crypto.randomUUID()}.${ext}`;
 const {data,error}=await NOOK_DB.storage.from(BACKEND.bucket).upload(path,file,{contentType:file.type||'application/octet-stream',upsert:false,cacheControl:'3600'});
 if(error)throw error;
 return data.path;
}
async function signedMedia(path){
 if(!path||path.startsWith('http'))return path||'';
 const {data,error}=await NOOK_DB.storage.from(BACKEND.bucket).createSignedUrl(path,3600);
 if(error)throw error;return data.signedUrl;
}

async function createProfileForUser(user,extra={}){

async function productionPublishV2(){
 const cr=S.cr,t=(S.drafts['post-text']||'').trim();
 let uploadedPath=null;
 try{
   if(cr.mode==='moment'){
     if(cr.kind==='poster'&&!t)return toast('Write something for your moment.');
     if(cr.kind!=='poster'&&!cr.media)return toast('Choose a photo or video.');
     let storagePath=null;
     if(cr.media?.file)storagePath=await uploadMedia(cr.media.file,'moments');uploadedPath=storagePath;
     const kind=cr.kind==='poster'?'text':cr.kind;
     const {data,error}=await NOOK_DB.from('moments').insert({
       author_id:authUser().id,kind,text:t,media_url:storagePath,
       expires_at:new Date(Date.now()+24*60*60*1000).toISOString()
     }).select().single();
     if(error)throw error;
     const mm={id:data.id,k:data.kind,text:data.text||'',src:storagePath?await signedMedia(storagePath):'',ts:new Date(data.created_at).getTime(),expires_at:data.expires_at};
     S.myMoms.unshift(mm);
     S.sheet=null;S.tab='feed';S.noRestore={feed:1};render();toast('Moment shared');return;
   }
   if(cr.kind==='poster'&&!t)return toast('Write something before posting.');
   if(cr.kind!=='poster'&&!cr.media)return toast('Choose a photo or video.');
   let storagePath=null;
   if(cr.media?.file)storagePath=await uploadMedia(cr.media.file,'posts');uploadedPath=storagePath;
   const p={id:crypto.randomUUID(),by:authUser().id,kind:cr.kind,text:t,aud:cr.aud||'public',likes:0,liked:false,saved:false,ts:Date.now(),comments:[],sensitive:false,storagePath};
   const row=await persistPost(p);
   p.ts=new Date(row.created_at||Date.now()).getTime();
   if(storagePath)p.src=await signedMedia(storagePath);
   S.posts.unshift(p);S.sheet=null;S.tab='feed';S.noRestore={feed:1};render();toast('Posted to Nook');
 }catch(e){toast(dbErr(e))}
}

/* Auth boot: no session means no demo user is allowed into the app. */
async function bootProduction(){
 if(!NOOK_DB){
   S.authReady=true;
   S.authError='Supabase configuration is missing. Add your publishable key to config.js.';
   render();return;
 }
 let activeUserId=null,loading=false;
 const applySession=async session=>{
   const id=session?.user?.id||null;
   if(!id){
     activeUserId=null;S.session=null;S.authReady=false;S.me.ready=false;stopRealtime();render();return;
   }
   if(loading||activeUserId===id)return;
   loading=true;
   try{
     await enterSession(session);
     activeUserId=id;
     startRealtime();startPresence();
   }catch(e){
     S.authError=dbErr(e);S.authReady=false;render();
   }finally{loading=false}
 };
 try{
   const {data:{session}}=await NOOK_DB.auth.getSession();
   if(session)await applySession(session);else{S.authReady=false;S.me.ready=false;render();}
   NOOK_DB.auth.onAuthStateChange((event,nextSession)=>{
     setTimeout(async()=>{
       if(event==='TOKEN_REFRESHED'&&activeUserId===nextSession?.user?.id)return;
       await applySession(nextSession);
     },0);
   });
 }catch(e){
   S.authError=dbErr(e);S.authReady=false;render();
 }
}
try{render();renderOv()}catch(e){console.error('Nook UI startup failed',e);document.body.innerHTML='<main style="font:16px system-ui;padding:32px;max-width:760px;margin:auto"><h1>Nook could not start</h1><p>The app hit a startup error instead of crashing silently.</p><pre style="white-space:pre-wrap;background:#f4f4f4;padding:16px;border-radius:12px">'+esc(String(e?.stack||e))+'</pre><button onclick="location.reload()" style="padding:10px 16px">Reload</button></main>'}try{Promise.resolve(bootProduction()).catch(e=>{console.error('Nook backend startup failed',e);S.authError='Unable to connect to Nook services. Please check your connection and try again.';S.authReady=false;render()})}catch(e){console.error('Nook boot failed',e)}

})();
